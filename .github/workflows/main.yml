name: CI/CD Pipeline API REST

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-and-deploy:
    name: Integracion y Despliegue Continuo (CI/CD)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar codigo fuente
        uses: actions/checkout@v4

      - name: 2. Configurar entorno Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 3. Instalar dependencias
        run: npm ci

      - name: 4. Ejecutar pruebas unitarias y cobertura
        run: npm run test:coverage
        env:
          CI: true

      - name: 5. Iniciar sesion en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 6. Construir y subir imagen a Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/webapp:latest
            ${{ secrets.DOCKER_USERNAME }}/webapp:${{ github.sha }}

      - name: 7. Despliegue automatico en AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/webapp:latest
            sudo docker stop webapp-container || true
            sudo docker rm webapp-container || true
            sudo docker run -d -e PORT=80 -p 80:80 -p 6061:6061 --name webapp-container --restart unless-stopped ${{ secrets.DOCKER_USERNAME }}/webapp:latest
